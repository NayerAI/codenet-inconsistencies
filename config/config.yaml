# ===========================================================================
# CodeNet cross-language inconsistency evaluation -- default configuration.
#
# Copy this file, edit what you need, and pass it with:
#     codenet-eval --config config/config.yaml <command>
# Any field you omit falls back to the built-in default shown here.
# ===========================================================================

# Root for ALL persistent data: the downloaded CodeNet dataset AND all results.
data_dir: ./data

# Languages to compare (at least two). Use each dataset's canonical labels:
#   codenet     : C, C++, Python, Java, Go, Ruby, ...   (stdin/stdout programs)
#   transcoder  : C++, Java, Python                      (parallel functions)
#   humaneval_x : Python, C++, Java, JavaScript, Go      (parallel functions)
languages:
  - C
  - Python
  - Java

log_level: INFO

dataset:
  # Which dataset to evaluate: codenet | transcoder | humaneval_x.
  type: codenet

  # --- CodeNet (type: codenet) ---------------------------------------------
  # Full Project CodeNet archive (7.8 GB compressed) on IBM Cloud Object Storage.
  # (The old dax-cdn.cdn.appdomain.cloud CDN was decommissioned by IBM.)
  # May also be a local path or file:// URL to extract without downloading.
  url: https://codait-cos-dax.s3.us.cloud-object-storage.appdomain.cloud/dax-project-codenet/1.0.0/Project_CodeNet.tar.gz
  archive_name: Project_CodeNet.tar.gz
  root_name: Project_CodeNet
  checksum_sha256: null   # optional integrity check after download

  # --- TransCoder-test (type: transcoder) ----------------------------------
  # A .tar.gz/.zip of facebookresearch/CodeGen (or a local path / file:// URL).
  transcoder_url: https://codeload.github.com/facebookresearch/CodeGen/tar.gz/refs/heads/main
  transcoder_subdir: data/transcoder_evaluation_gfg

  # --- HumanEval-X (type: humaneval_x) -------------------------------------
  # Base URL holding per-language humaneval_<lang>.jsonl.gz (THUDM/CodeGeeX).
  humaneval_x_base_url: https://raw.githubusercontent.com/THUDM/CodeGeeX/main/codegeex/benchmark/humaneval-x

  # Function datasets: wrap each sample in a generated stdin/stdout driver so it
  # becomes a normal program (kind=program) and is evaluated EXACTLY like CodeNet
  # -- same prompt, same execution verification. Implemented for HumanEval-X
  # (Python/JS generic; C++/Java/Go type-directed from the declaration; samples
  # with unsupported signatures are skipped for that language). If false, samples
  # stay functions and are verified via LLM-written drivers. (TransCoder currently
  # always uses the LLM-driver path.)
  wrap_functions: true

sampling:
  percent: 1.0            # X% of eligible problems (default 1%)
  seed: 42                # reproducible sampling
  max_samples: null       # optional hard cap on number of problems
  require_accepted: true  # only use "Accepted" submissions as representatives

pairing:
  # "reference": compare reference_language vs every other language (n-1 pairs;
  #              two requests for three languages -- the default).
  # "all":       compare every language pair (n*(n-1)/2 pairs).
  strategy: reference
  reference_language: C

llm:
  provider: openrouter
  model: anthropic/claude-3.5-sonnet
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY   # env var holding your OpenRouter key
  temperature: 0.0
  max_tokens: 2048
  request_timeout: 120
  max_retries: 4
  retry_backoff: 2.0
  max_code_chars: 16000             # per-submission truncation to bound tokens
  include_problem_description: true # include statement + sample I/O in prompt
  json_mode: true                   # request response_format=json_object
  extra_headers: {}                 # e.g. {HTTP-Referer: ..., X-Title: ...}

verification:
  # Execute the LLM's proposed divergence and check it really diverges.
  #   codenet (programs): run the ORIGINAL programs on the diverging stdin.
  #   transcoder / humaneval_x (functions): the LLM also returns a runnable
  #     driver per language (function_drivers); both are executed and compared.
  # Toolchains (gcc/g++/python3/javac+java/go/node) are all in the Apptainer image.
  enabled: true
  function_drivers: true            # ask for + run per-language drivers (functions)
  run_timeout_seconds: 10
  compile_timeout_seconds: 30
  max_output_bytes: 100000
  memory_limit_mb: 1024
  python_bins: [python3, python2]   # try each; first clean run (exit 0) wins
  gcc_bin: gcc
  gpp_bin: g++
  javac_bin: javac
  java_bin: java
  go_bin: go
  node_bin: node

execution:
  # Parallel workers for the evaluation stage (one LLM request + its optional
  # verification per task). 1 = sequential. The work is I/O-bound (HTTP +
  # subprocess), so threads help a lot. Too high may hit the provider's rate
  # limits (the client retries 429s). Override per run with --workers N.
  workers: 4

output:
  results_dir: results   # relative to data_dir (so results live under data/)
  run_name: null         # null -> a timestamped run directory is created
